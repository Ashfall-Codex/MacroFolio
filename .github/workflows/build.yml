name: Build

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Prepare Dalamud dev environment
        run: |
          DALAMUD_PATH="$HOME/.xlcore/dalamud/Hooks/dev"
          mkdir -p "$DALAMUD_PATH"
          curl -L https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -o latest.zip
          unzip -o latest.zip -d "$DALAMUD_PATH"
          rm -f latest.zip
          echo "DALAMUD_DIR=$DALAMUD_PATH" >> $GITHUB_ENV

      - name: Restore
        run: dotnet restore MacroFolio/MacroFolio.csproj

      - name: Build
        run: dotnet build MacroFolio/MacroFolio.csproj --no-restore -c Release -p:ContinuousIntegrationBuild=true

      - name: Package
        run: |
          cd MacroFolio/bin/Release
          zip -r latest.zip *.dll *.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroFolio
          path: MacroFolio/bin/Release/latest.zip
          if-no-files-found: error
